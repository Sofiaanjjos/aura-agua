<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraÁgua: Tanque de Energia & Foco Neon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neonPink: '#ec4899',
                        neonPurple: '#a855f7',
                        darkBg: '#09090b',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'wave': 'wave 2.5s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        wave: {
                            '0%': { transform: 'translateX(0) scaleY(1)' },
                            '100%': { transform: 'translateX(-10px) scaleY(1.05)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .neon-glow {
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.4), inset 0 0 20px rgba(168, 85, 247, 0.3);
        }
        .neon-btn-glow {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
        }
        .neon-btn-glow:hover {
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.9), 0 0 15px rgba(168, 85, 247, 0.7);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <header class="w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center shadow-lg shadow-pink-600/40 text-white font-bold text-xl animate-float">
                    💧
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">AuraÁgua</h1>
                    <p class="text-[10px] text-zinc-400 uppercase tracking-widest font-semibold">Tanque de Foco & Aura</p>
                </div>
            </div>
            <button onclick="resetData()" class="text-xs text-zinc-400 hover:text-pink-400 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                <span>🔄</span> Reiniciar
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 py-6 flex flex-col justify-center items-center gap-6">
        
        <!-- Status Notification Box -->
        <div id="statusBanner" class="w-full bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 text-center transition-all duration-300">
            <p id="statusText" class="text-xs font-medium text-pink-300 leading-relaxed">🔋 Mente em modo de repouso. Beba água para despertar sua aura de foco!</p>
        </div>

        <div class="relative w-full max-w-[240px] h-[320px] bg-zinc-900/60 border-2 border-zinc-800/80 rounded-3xl p-3 neon-glow flex flex-col justify-end overflow-hidden group">
            
            <!-- Grid Lines Background Inside Tank -->
            <div class="absolute inset-0 bg-[linear-gradient(to_right,#27272a_1px,transparent_1px),linear-gradient(to_bottom,#27272a_1px,transparent_1px)] bg-[size:24px_24px] opacity-20 pointer-events-none"></div>

            <!-- Rising Liquid Fill Element -->
            <div id="liquidFill" class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-pink-600 via-purple-600 to-pink-500 opacity-90 transition-all duration-500 rounded-b-[22px] flex flex-col items-center justify-start pt-3" style="height: 0%;">
                <!-- Wave Effect Glow Top -->
                <div class="w-full h-3 bg-pink-300/40 blur-[3px] animate-wave"></div>
            </div>

            <!-- Central Tank Stats Overlay -->
            <div class="relative z-10 text-center mb-6 pointer-events-none">
                <div id="tankPercent" class="text-4xl font-black text-white drop-shadow-md">0%</div>
                <div id="tankVolume" class="text-xs font-semibold text-pink-200 mt-1 tracking-wide">0 / 2000 ml</div>
            </div>

            <!-- Floating Bubbles Decorative Animation -->
            <div class="absolute bottom-6 left-8 w-2 h-2 rounded-full bg-white/40 animate-pulse"></div>
            <div class="absolute bottom-16 right-10 w-3 h-3 rounded-full bg-white/30 animate-pulse" style="animation-delay: 1s;"></div>
            <div class="absolute bottom-24 left-14 w-1.5 h-1.5 rounded-full bg-white/50 animate-pulse" style="animation-delay: 0.5s;"></div>
        </div>

        <div class="w-full flex flex-col gap-3">
            <button onclick="addWater(250)" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold text-base rounded-2xl neon-btn-glow transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <span class="text-xl">💧</span> Beber Copo de Água (+250ml)
            </button>

            <!-- Quick Sub controls -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="addWater(100)" class="py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 text-xs font-semibold rounded-xl transition-colors flex items-center justify-center gap-1.5 active:scale-95">
                    <span>✨</span> +100ml Aura Extra
                </button>
                <button onclick="removeWater(250)" class="py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-pink-400 text-xs font-semibold rounded-xl transition-colors flex items-center justify-center gap-1.5 active:scale-95">
                    <span>↩️</span> Desfazer (-250ml)
                </button>
            </div>
        </div>

        <div class="w-full grid grid-cols-3 gap-2.5 pt-1">
            <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl p-3 text-center">
                <div class="text-[10px] text-zinc-400 uppercase font-semibold">Copos</div>
                <div id="statCups" class="text-base font-bold text-pink-400 mt-0.5">0 / 8</div>
            </div>
            <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl p-3 text-center">
                <div class="text-[10px] text-zinc-400 uppercase font-semibold">Bônus Aura</div>
                <div id="statFocus" class="text-base font-bold text-purple-400 mt-0.5">Baixo</div>
            </div>
            <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl p-3 text-center">
                <div class="text-[10px] text-zinc-400 uppercase font-semibold">Sequência</div>
                <div id="statStreak" class="text-base font-bold text-amber-400 mt-0.5">🔥 1d</div>
            </div>
        </div>

    </main>

    <footer class="w-full border-t border-zinc-800/80 bg-zinc-950 py-3 text-center text-xs text-zinc-500">
        AuraÁgua • Foco, Sobrevivência & Hidratação Neon
    </footer>

    <script>
        let appState = {
            currentMl: 0,
            targetMl: 2000,
            streak: 1
        };

        window.onload = function() {
            loadStorage();
            updateUI();
        };

        function saveStorage() {
            localStorage.setItem('auraagua_state', JSON.stringify(appState));
        }

        function loadStorage() {
            const saved = localStorage.getItem('auraagua_state');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch(e) {
                    console.error('Erro ao carregar dados salvos', e);
                }
            }
        }

        function addWater(amount) {
            appState.currentMl += amount;
            if (appState.currentMl > appState.targetMl) {
                appState.currentMl = appState.targetMl;
            }
            saveStorage();
            updateUI();
        }

        function removeWater(amount) {
            appState.currentMl -= amount;
            if (appState.currentMl < 0) {
                appState.currentMl = 0;
            }
            saveStorage();
            updateUI();
        }

        function resetData() {
            appState.currentMl = 0;
            saveStorage();
            updateUI();
        }

        function updateUI() {
            const percent = Math.min(100, Math.round((appState.currentMl / appState.targetMl) * 100));
            const cupsDrunk = Math.floor(appState.currentMl / 250);

            // Update Tank Visual Elements
            document.getElementById('liquidFill').style.height = `${percent}%`;
            document.getElementById('tankPercent').innerText = `${percent}%`;
            document.getElementById('tankVolume').innerText = `${appState.currentMl} / ${appState.targetMl} ml`;

            // Update Mini Stat Cards
            document.getElementById('statCups').innerText = `${cupsDrunk} / 8`;
            document.getElementById('statStreak').innerText = `🔥 ${appState.streak}d`;

            // Update Aura & Status Banner
            const banner = document.getElementById('statusBanner');
            const statusText = document.getElementById('statusText');
            const focusStat = document.getElementById('statFocus');

            if (percent === 0) {
                statusText.innerHTML = "🔋 Mente em modo de repouso. Beba água para despertar sua aura de foco!";
                focusStat.innerText = "Baixo";
                banner.className = "w-full bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-4 text-center transition-all duration-300";
            } else if (percent < 50) {
                statusText.innerHTML = "✨ <strong>Aura Despertando!</strong> Sua claridade mental começou a fluir para as missões.";
                focusStat.innerText = "Médio ⚡";
                banner.className = "w-full bg-purple-950/40 border border-purple-800/50 rounded-2xl p-4 text-center transition-all duration-300";
            } else if (percent < 100) {
                statusText.innerHTML = "🚀 <strong>Fluxo Intenso Ativado!</strong> Bônus de energia desbloqueado para tarefas pesadas.";
                focusStat.innerText = "Alto 🔥";
                banner.className = "w-full bg-pink-950/40 border border-pink-800/50 rounded-2xl p-4 text-center transition-all duration-300";
            } else {
                statusText.innerHTML = "🌟 <strong>Tanque 100% Completo!</strong> Aura suprema atingida. Produtividade máxima!";
                focusStat.innerText = "Supremo ✨";
                banner.className = "w-full bg-gradient-to-r from-pink-900/50 to-purple-900/50 border border-pink-500/50 rounded-2xl p-4 text-center transition-all duration-300 shadow-lg shadow-pink-500/20";
            }
        }
    </script>
</body>
</html>
